[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiclipedia"
version = "0.3.1"
description = "Minimalist Wikipedia CLI client for terminal dwellers."
readme = "README.md"
authors = [{ name="seto" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black~=26.3",
    "build~=1.5",
    "invoke~=3.0",
    "isort>=8,<10",
    "mypy~=2.3",
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "ruff~=0.16",
    "twine>=6.2,<8.0"
]

[project.urls]
Source = "https://github.com/seto/wiCLIpedia"
Changelog = "https://github.com/seto/wiCLIpedia/blob/master/CHANGES.md"

[project.scripts]
wicli = "wicli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear 
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify 
    "FURB", # refurb
]
ignore = ["E501"]  # Ignore line length errors, as Black handles formatting

[tool.coverage.run]
omit = ["src/wicli/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == \\\"__main__\\\":",
]
